[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "netlify-plugin-no-more-404"
    [plugins.inputs]
      on404 = 'warn'
      cacheKey = 'postman-ui-2026'

[[plugins]]
package = "@netlify/plugin-sitemap"
  [plugins.inputs]
  buildDir = "."
  prettyURLs = true
  baseUrl = "https://arjun.me"
