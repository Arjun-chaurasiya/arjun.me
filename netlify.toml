[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "netlify-plugin-no-more-404"
    [plugins.inputs]
      on404 = 'error'
      cacheKey = 'anystring'

[[plugins]]
package = "@netlify/plugin-sitemap"
  [plugins.inputs]
  buildDir = "."
  prettyURLs = true
  homepage = "https://arjun.me"
